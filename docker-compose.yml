services:
  package:
    build:
      context: ./docker
      dockerfile: node.Dockerfile
    image: meilisearch-js-dev
    tty: true
    stdin_open: true
    working_dir: /home/package
    environment:
      - MEILISEARCH_URL=http://meilisearch:7700
    depends_on:
      - meilisearch
    links:
      - meilisearch
    volumes:
      - ./:/home/package
      # Hide the host node_modules. Native bindings stay in this volume.
      - package_node_modules:/home/package/node_modules

  meilisearch:
    image: getmeili/meilisearch-enterprise:v1.54
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey
      - MEILI_NO_ANALYTICS=true
      - MEILI_EXPERIMENTAL_ALLOWED_IP_NETWORKS=any

volumes:
  package_node_modules:
